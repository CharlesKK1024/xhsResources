<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>XHS-Downloader Web</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📕</text></svg>"
    />
    <link rel="stylesheet" href="/web/static/style.css?v=20260519f" />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <!-- 作品集筛选栏 (动态显隐) -->
        <div id="historyControls" class="sidebar-filter">
          <button id="tagPanelBtn" class="filter-bar-tag-btn">🏷️ 标签集</button>
          <input type="text" id="historySearch" class="filter-bar-search" placeholder="搜索..." />
          <select id="historySort" class="filter-bar-sort">
            <option value="time_desc">新→旧</option>
            <option value="time_asc">旧→新</option>
            <option value="author">按作者</option>
            <option value="count_desc">作品多→少</option>
            <option value="count_asc">作品少→多</option>
          </select>
        </div>
        <div class="logo">
          <span class="logo-icon">📕</span>
          <h1 class="logo-text">XHS-Downloader</h1>
        </div>
        <nav class="nav-menu">
          <button class="nav-item" data-target="extract-page">
            <span class="nav-icon">🔍</span> 提取作品
          </button>
          <button class="nav-item active" data-target="history-page">
            <span class="nav-icon">🕒</span> 作品集
          </button>
          <button class="nav-item" data-target="collection-page">
            <span class="nav-icon">⭐</span> 个人收藏
          </button>
        </nav>
      </aside>

      <!-- 顶部操作栏 -->
      <div class="top-header-actions">
        <button id="pageRefreshBtn" class="action-btn refresh-page-btn" title="刷新页面">🔄</button>
        <button id="msgStationBtn" class="action-btn msg-station-btn" title="信息站" style="display: none">💬<span id="msgBadge" class="msg-badge" style="display: none">0</span></button>
        <!-- 用户信息 -->
        <div id="userWidget" class="user-widget" style="display: none">
          <div class="user-avatar-wrap">
            <img id="userAvatar" class="user-avatar" src="" alt="头像" />
          </div>
          <div class="user-nameplate">
            <span id="userNickname" class="user-nickname"></span>
          </div>
        </div>
        <!-- 作品集搜索/排序 (仅作品集页面显示) -->
        <div id="cardScaler" class="scaler-popup" style="display: none">
          <span class="scaler-label">卡片缩放</span>
          <input type="range" id="scaleRange" min="-80" max="150" value="0" />
          <span id="scaleValue" class="scale-value">100%</span>
        </div>
        <button
          id="scaleBtn"
          class="action-btn"
          title="调整卡片大小"
          style="display: none"
        >
          🔍
        </button>
        <button id="editModeToggle" class="action-btn action-btn-edit" title="编辑模式" style="display: none">
          ✏️
        </button>
        <button id="mapBtn" class="action-btn" title="地图统计" style="display: none">🌍</button>
        <button id="themeToggle" class="action-btn" title="切换深色/浅色模式">
          🌙
        </button>
        <button id="settingsBtn" class="action-btn" title="设置">⚙️</button>
      </div>

      <main class="main-content">
        <!-- 快速滚动导轨 -->
        <div id="scrollRail" class="scroll-rail">
          <div class="scroll-rail-track">
            <div class="scroll-rail-thumb"></div>
          </div>
        </div>
        <!-- 提取页面 -->
        <section id="extract-page" class="page">
          <div class="input-section">
            <div class="input-group">
              <textarea
                id="urlInput"
                placeholder="粘贴作品链接 / 作者主页链接 / 输入作者名搜索..."
                class="url-input"
                rows="2"
              ></textarea>
            </div>
            <div class="button-group">
              <button id="pasteBtn" class="paste-btn">
                <span class="btn-icon">📋</span> 粘贴链接
              </button>
              <button id="clearBtn" class="clear-btn">
                <span class="btn-icon">🧹</span> 一键清空
              </button>
              <button id="fetchBtn" class="fetch-btn">
                <span class="btn-icon">🚀</span> 获取信息
              </button>
              <button id="browseUsersBtn" class="browse-users-icon-btn" title="搜索站内用户">👥</button>
            </div>
            <button
              id="refreshBtn"
              class="refresh-btn"
              title="强制刷新（重新向小红书请求数据）"
              style="display: none"
            >
              <span class="btn-icon">🔄</span>
            </button>
            <div id="detectedLinks" class="detected-links" style="display: none"></div>
          </div>

          <div class="extract-scroll-area">
            <div id="userBrowserContainer" class="ub-container" style="display: none">
              <!-- 由 userBrowser.js 动态填充 -->
            </div>

            <div id="loading" class="loading" style="display: none">
              <!-- 由 tools.js 动态生成 -->
            </div>

            <div id="result" class="result" style="display: none">
            <div class="result-header">
              <h2>作品预览</h2>
              <div class="result-actions">
                <button id="starBtn" class="star-btn" title="加入收藏">
                  ⭐ 收藏
                </button>
                <button id="copyBtn" class="copy-btn">📋 复制链接</button>
              </div>
            </div>

            <div class="note-card">
              <div class="cover">
                <img
                  id="coverImg"
                  src=""
                  alt="封面"
                  referrerpolicy="no-referrer"
                />
              </div>
              <div class="info">
                <h3 id="title"></h3>
                <div class="author-info">
                  <span class="author">👤 <span id="author"></span></span>
                  <span class="time">📅 <span id="publishTime"></span></span>
                </div>
                <p id="desc"></p>
                <div class="meta">
                  <span>❤️ <span id="likeCount">0</span></span>
                  <span>⭐ <span id="collectCount">0</span></span>
                  <span>💬 <span id="commentCount">0</span></span>
                </div>
                <div id="tags" class="tag-container"></div>
              </div>
            </div>

            <div class="preview-section">
              <div class="section-header">
                <div class="section-title-group">
                  <h3>🖼️ 内容预览</h3>
                  <button id="editModeBtn" class="edit-mode-btn">
                    ✏️ 编辑模式
                  </button>
                </div>
                <button
                  id="downloadAllBtn"
                  class="download-all-btn"
                  style="display: none"
                >
                  全部下载
                </button>
              </div>
              <div id="previewList" class="preview-list"></div>
            </div>
          </div>
          </div>
        </section>

        <!-- 作品集页面 -->
        <section id="history-page" class="page active">
          <div id="historyList" class="data-list">
            <!-- 动态生成 -->
          </div>
        </section>

        <!-- 收藏夹页面 -->
        <section id="collection-page" class="page">
          <header class="page-header">
            <h2>个人收藏</h2>
            <div class="header-actions">
              <div class="search-box">
                <input
                  type="text"
                  id="collectionSearch"
                  placeholder="搜索收藏..."
                />
              </div>
              <button id="exportBtn" class="export-btn">📤 导出收藏</button>
            </div>
          </header>
          <div class="collection-filters">
            <button class="filter-btn active" data-tag="all">全部</button>
            <!-- 动态生成标签过滤器 -->
          </div>
          <div id="collectionList" class="data-list">
            <!-- 动态生成 -->
          </div>
        </section>

        <div id="error" class="error" style="display: none">
          <div class="error-icon">⚠️</div>
          <p id="errorMsg"></p>
        </div>
      </main>

      <div id="settingsPanel" class="settings-panel" style="display: none">
        <div class="settings-content">
          <div class="settings-header">
            <h3>设置</h3>
            <button id="closeSettings" class="close-btn">✕</button>
          </div>
          <div class="settings-body">
            <div class="setting-item">
              <label>下载目录</label>
              <input
                type="text"
                id="settingPath"
                placeholder="默认: Volume/Download"
              />
            </div>
            <div class="setting-item">
              <label>图片格式</label>
              <select id="settingImageFormat">
                <option value="webp" selected>WebP (推荐)</option>
                <option value="jpeg">JPEG</option>
                <option value="png">PNG</option>
                <option value="auto">自动</option>
              </select>
            </div>
            <div class="setting-item">
              <label>视频偏好</label>
              <select id="settingVideoPref">
                <option value="resolution">画质优先</option>
                <option value="bitrate">码率优先</option>
                <option value="size">大小优先</option>
              </select>
            </div>
            <div class="setting-item">
              <label>代理</label>
              <input
                type="text"
                id="settingProxy"
                placeholder="HTTP 代理地址（可选）"
              />
            </div>
            <div class="setting-item">
              <label>小红书 Cookie</label>
              <textarea
                id="settingCookie"
                placeholder="粘贴小红书 Cookie... (用于获取完整内容)"
                rows="3"
                style="width: 100%; padding: 1vh; border-radius: 1vh; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 1.4vh; resize: vertical;"
              ></textarea>
            </div>
            <button id="saveSettings" class="save-btn">保存设置</button>
          </div>
        </div>
      </div>

      <footer class="footer">
        <p>XHS-Downloader Web Interface</p>
        <p class="tips">提示：部分作品需要登录 Cookie 才能查看完整内容</p>
      </footer>
    </div>

    <!-- 瀑布流查看器 (全屏平铺预览) -->
    <div id="waterfallViewer" class="waterfall-viewer" style="display: none">
      <div class="waterfall-header">
        <div class="waterfall-title-group">
          <span class="waterfall-author-icon">👤</span>
          <h3 id="waterfallTitle">作者作品集</h3>
        </div>
        <button class="waterfall-close">✕</button>
      </div>
      <div id="waterfallContent" class="waterfall-content">
        <!-- 动态生成瀑布流图片 -->
      </div>
    </div>

    <!-- 全景查看器 (沉浸式大图预览) -->
    <div id="fullViewer" class="full-viewer" style="display: none">
      <div class="viewer-overlay"></div>
      <div class="viewer-content">
        <img id="viewerImg" src="" alt="预览图" referrerpolicy="no-referrer" />
        <div id="viewerCounter" class="viewer-counter">1 / 1</div>
      </div>
      <button class="viewer-close">✕</button>
      <button class="viewer-nav prev">‹</button>
      <button class="viewer-nav next">›</button>
    </div>

    <!-- 笔记详情弹窗 (仿小红书原生界面) -->
    <div id="noteDetailViewer" class="note-detail-viewer" style="display: none">
      <div class="note-detail-header">
        <div class="note-detail-author">
          <button class="note-detail-back">‹</button>
          <img id="noteAvatar" src="" class="note-avatar" />
          <span id="noteAuthorName" class="note-author-name"></span>
        </div>
        <div class="note-detail-actions">
          <button class="note-follow-btn">关注</button>
          <button id="noteShareBtn" class="note-share-btn"></button>
        </div>
      </div>
      <div class="note-detail-content">
        <div class="note-media-container">
          <div id="noteMediaWrapper" class="note-media-wrapper">
            <!-- 动态生成图片/视频 -->
          </div>
          <div id="noteMediaCounter" class="note-media-counter">1/1</div>
        </div>
        <div class="note-media-toolbar">
          <button id="noteOriginalLink" class="note-original-btn" title="查看原帖">🔗</button>
          <div id="noteMediaDots" class="note-media-dots"></div>
        </div>
        <div class="note-text-content">
          <h2 id="noteDetailTitle" class="note-title"></h2>
          <p id="noteDetailDesc" class="note-desc"></p>
          <div id="noteDetailTags" class="note-tags"></div>
          <div id="noteDetailTime" class="note-time"></div>
        </div>
      </div>
      <div class="note-detail-footer">
        <div class="note-footer-input">说点什么...</div>
        <div class="note-footer-actions">
          <span class="footer-action">❤️ <span id="noteLikeCount"></span></span>
          <span class="footer-action"
            >⭐ <span id="noteCollectCount"></span
          ></span>
          <span class="footer-action"
            >💬 <span id="noteCommentCount"></span
          ></span>
        </div>
      </div>
    </div>

    <!-- 登录弹窗 -->
    <div id="loginModal" class="login-modal" style="display: none">
      <div class="login-overlay"></div>
      <div class="login-box">
        <div class="login-icon">📕</div>
        <h2 class="login-title">欢迎使用典藏版小红书</h2>
        <p class="login-desc" id="loginDesc">输入昵称和密码登录，同一账号跨设备同步数据</p>
        <div class="login-avatar-row">
          <div class="login-avatar" id="loginAvatarPreview">👤</div>
        </div>
        <input
          type="text"
          id="loginNickname"
          class="login-input"
          placeholder="输入你的昵称..."
          maxlength="20"
          autocomplete="username"
        />
        <div class="login-password-row">
          <input
            type="password"
            id="loginPassword"
            class="login-input"
            placeholder="输入密码..."
            maxlength="32"
            autocomplete="current-password"
          />
          <button type="button" id="loginPasswordToggle" class="login-pw-toggle">👁️</button>
        </div>
        <div id="loginError" class="login-error" style="display: none"></div>
        <label class="login-remember">
          <input type="checkbox" id="loginRemember" />
          <span>记住账号密码</span>
        </label>
        <button id="loginBtn" class="login-btn">登录</button>
        <div class="login-reset-row">
          <button id="loginResetBtn" class="login-reset-btn">忘记密码？重置</button>
        </div>
      </div>
    </div>

    <!-- 个人设置弹窗 -->
    <div id="profileModal" class="profile-modal" style="display: none">
      <div class="profile-overlay"></div>
      <div class="profile-box">
        <div class="profile-header">
          <h3>个人设置</h3>
          <button id="profileClose" class="profile-close">✕</button>
        </div>
        <div class="profile-body">
          <div class="profile-avatar-section">
            <img id="profileAvatar" class="profile-avatar" src="" alt="头像" />
            <button id="profileAvatarBtn" class="profile-avatar-btn">更换头像</button>
            <input type="file" id="profileAvatarInput" accept="image/*" style="display: none" />
          </div>
          <div class="profile-field">
            <label>昵称</label>
            <input type="text" id="profileNickname" class="profile-input" maxlength="20" />
          </div>
          <div class="profile-field">
            <label>主题模式</label>
            <div class="profile-theme-row">
              <button id="profileThemeDark" class="profile-theme-btn active">🌙 深色</button>
              <button id="profileThemeLight" class="profile-theme-btn">☀️ 浅色</button>
            </div>
          </div>
          <button id="profileSave" class="profile-save-btn">保存设置</button>
          <button id="profileLogout" class="profile-logout-btn">退出登录</button>
        </div>
      </div>
    </div>

    <link rel="stylesheet" href="/web/static/componentUtils/authorProfile/authorProfile.css">
    <link rel="stylesheet" href="/web/static/componentUtils/chatUI/chatUI.css">
    <link rel="stylesheet" href="/web/static/componentUtils/messageStation/messageStation.css">
    <link rel="stylesheet" href="/web/static/componentUtils/tips/tips.css">
    <link rel="stylesheet" href="/web/static/componentUtils/userBrowser/userBrowser.css">

    <script src="/web/static/lib/echarts.min.js"></script>
    <script src="/web/static/lib/china.js"></script>
    <script src="/web/static/utils/swipe.js?v=20260519a"></script>
    <script src="/web/static/utils/swipeClose.js"></script>
    <script src="/web/static/utils/svg.js"></script>
    <script src="/web/static/utils/tools.js"></script>
    <script src="/web/static/utils/uiCache.js?v=20260519c"></script>
    <script src="/web/static/componentUtils/toast/toast.js"></script>
    <script src="/web/static/componentUtils/tips/tips.js"></script>
    <script src="/web/static/componentUtils/authorProfile/authorProfile.js?v=20260519c"></script>
    <script src="/web/static/componentUtils/chatUI/chatUI.js?v=20260519c"></script>
    <script src="/web/static/componentUtils/messageStation/messageStation.js?v=20260519e"></script>
    <script src="/web/static/componentUtils/userBrowser/userBrowser.js?v=20260519c"></script>
    <script src="/web/static/script.js?v=20260519f"></script>
  </body>
</html>
